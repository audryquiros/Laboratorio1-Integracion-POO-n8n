<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facturación POO</title><style>
body{font-family:system-ui,sans-serif;background:#f5f6ff;color:#26243d;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}header{background:linear-gradient(120deg,#4f46c8,#8523b7);color:white;padding:24px;border-radius:16px}.card{background:white;padding:20px;border:1px solid #e2e3f2;border-radius:14px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}label{font-size:.9rem;font-weight:600}input,select{display:block;width:100%;box-sizing:border-box;padding:10px;margin-top:6px;border:1px solid #c9cce0;border-radius:8px}button{padding:11px 15px;margin-top:14px;border:0;border-radius:8px;background:#5146c8;color:white;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #eee;padding:9px}.error{color:#a22;background:#fff0f0;padding:10px}</style></head><body><main class="wrap"><header><h1>Facturación con días hábiles</h1><p>POO: herencia, polimorfismo y calendario laboral.</p></header>
<section class="card"><h2>Calcular factura</h2><form id="f"><div class="grid">
<label>ID<input id="id" type="number" value="101" required></label><label>Cliente<input id="cliente" value="Comercial La Ceiba" required></label>
<label>Fecha emisión<input id="fecha" type="date" value="2026-10-19" required></label><label>Tipo<select id="tipo"><option value="credito">Crédito</option><option value="contado">Contado</option></select></label>
<label>Días hábiles<input id="dias" type="number" min="1" value="15"></label><label>Monto CRC<input id="monto" type="number" min="0" value="125000"></label><label>Estado<select id="estado"><option>pendiente</option><option>pagada</option><option>anulada</option></select></label></div><button>Calcular</button><button type="button" id="err">Probar error controlado</button></form><p id="msg"></p></section>
<section class="card"><h2>Resultado</h2><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Clase</th><th>Cliente</th><th>Vencimiento</th><th>Estado</th></tr></thead><tbody id="out"><tr><td colspan="5">Sin resultados</td></tr></tbody></table></div></section></main>
<script src="clases.js"></script><script>
const {CalendarioLaboral,FacturaCredito,FacturaContado}=LabFacturacion;const cal=new CalendarioLaboral(['2026-01-01','2026-04-02','2026-04-03','2026-05-01']);const $=x=>document.getElementById(x);
$('f').addEventListener('submit',e=>{e.preventDefault();try{const d={id:Number($('id').value),cliente:$('cliente').value.trim(),fechaEmision:$('fecha').value,diasPlazo:Number($('dias').value),monto:Number($('monto').value),estado:$('estado').value};const f=$('tipo').value==='contado'?new FacturaContado(d):new FacturaCredito(d);const due=f.calcularVencimiento(cal);$('out').innerHTML=`<tr><td>${f.id}</td><td>${f.constructor.name}</td><td>${f.cliente}</td><td>${due}</td><td>${f.determinarEstado(new Date().toISOString().slice(0,10),due)}</td></tr>`;$('msg').textContent='Cálculo correcto.'}catch(e){$('msg').innerHTML=`<span class="error">${e.message}</span>`}});
$('err').onclick=()=>{try{new FacturaCredito({id:99,cliente:'Falta fecha'}).calcularVencimiento(cal)}catch(e){$('msg').innerHTML=`<span class="error">Error controlado: ${e.message}</span>`}};
</script></body></html>
